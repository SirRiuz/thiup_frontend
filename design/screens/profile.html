<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>Mis hilos · Thiup (maqueta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="../assets/tokens.css" />
<link rel="stylesheet" href="../assets/base.css" />
<link rel="stylesheet" href="../assets/components.css" />
</head>
<body>
  <div class="app-shell">
    <div id="nav-rail-mount"></div>

    <div class="screen-page">
      <header class="thread-appbar">
        <div class="thread-appbar-inner" style="grid-template-columns:1fr minmax(auto,65%) 1fr;">
          <button type="button" class="back-button" onclick="location.href='home.html'" aria-label="Atrás">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 6h10M1 6l4-4M1 6l4 4" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg>
          </button>
          <span class="thread-title">Perfil</span>
          <span></span>
        </div>
      </header>

      <main class="screen-main">
        <div class="corner-mask" aria-hidden="true">
          <div class="corner-mask-window"><div class="corner-mask-shape"></div></div>
        </div>

        <div class="surface" style="padding-top:12px;">
          <section class="profile-header">
            <div class="profile-top-row">
              <div class="profile-identity">
                <div class="profile-name-row">
                  <h1 class="profile-name">Anónimo</h1>
                  <span class="you-badge">Tú</span>
                </div>
                <div>
                  <button type="button" class="hash-pill" id="hash-pill" data-copy-link></button>
                </div>
              </div>
              <button type="button" class="profile-avatar-wrap" id="profile-avatar" aria-label="Foto de perfil"></button>
            </div>
            <p class="profile-stats-line" id="profile-stats"></p>
            <p class="profile-joined" id="profile-joined"></p>
          </section>

          <div class="tabs" data-tabs="profile">
            <button type="button" class="tab is-active" data-tab="mine">Hilos</button>
            <button type="button" class="tab" data-tab="media">Media</button>
            <span class="tab-indicator"></span>
          </div>

          <section class="feed-items" data-tab-panel-group="profile" data-tab-panel="mine" id="my-feed-mount"></section>
          <section data-tab-panel-group="profile" data-tab-panel="media" hidden>
            <div class="media-grid-mosaic is-flush" id="my-media-mount"></div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/icons.js"></script>
  <script src="../assets/avatar.js"></script>
  <script src="../assets/reaction-emoji.js"></script>
  <script src="../assets/illustrations.js"></script>
  <script src="../assets/mock-data.js"></script>
  <script src="../assets/app.js"></script>
  <script>
    renderNavRail("profile");
    document.getElementById("profile-avatar").innerHTML = maskAvatarSVG(MockData.currentUser.id, 84, { online: true });
    document.getElementById("hash-pill").innerHTML = `<span>${MockData.currentUser.id}</span>${Icons.copy()}`;
    document.getElementById("profile-joined").innerHTML = `${Icons.calendar()}<span>Se unió en ${MockData.myProfile.joined}</span>`;
    const s = MockData.myProfile.stats;
    document.getElementById("profile-stats").innerHTML =
      `<span class="value">${s.threads}</span> hilos <span class="dot"> · </span><span class="value">${s.reactions}</span> reacciones <span class="dot"> · </span><span class="value">${s.replies}</span> respuestas`;

    document.getElementById("my-feed-mount").innerHTML = MockData.feed
      .map((post, i) => renderFeedCard(post, { isLast: i === MockData.feed.length - 1 }))
      .join("");

    const mediaPosts = MockData.feed.filter((p) => p.media && p.media.length);
    document.getElementById("my-media-mount").innerHTML = mediaPosts
      .map((_, i) => `<button type="button" class="mosaic-tile" style="background:${i % 2 ? "#f3efe6" : "linear-gradient(135deg,#efe6d6,#e2d3b8)"}" onclick="location.href='thread.html?id=${mediaPosts[i].uid}'"></button>`)
      .join("");
  </script>
</body>
</html>
